[project]
name = "axio-transport-openai"
version = "0.2.3"
description = "OpenAI-compatible transport for Axio"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["llm", "agent", "ai", "openai", "transport", "openai-compatible"]
dependencies = ["axio", "axio-responses", "axio-sse", "aiohttp>=3.11", "PyJWT[crypto]>=2.10.1", "yarl>=1.18"]

[project.optional-dependencies]
tui = ["textual>=2.1.0"]
examples = ["partial-json-parser>=0.2"]

[project.scripts]
axio-chatgpt = "axio_transport_openai.cli:main"

[project.entry-points."axio.transport"]
chatgpt = "axio_transport_openai:ChatGPTTransport"
openai = "axio_transport_openai:OpenAITransport"
nebius = "axio_transport_openai.nebius:NebiusTransport"
openrouter = "axio_transport_openai.openrouter:OpenRouterTransport"
openai-custom = "axio_transport_openai.custom:OpenAICompatibleTransport"

[project.entry-points."axio.transport.stt"]
openai = "axio_transport_openai:OpenAISTTTransport"

[project.entry-points."axio.transport.tts"]
openai = "axio_transport_openai:OpenAITTSTransport"

[project.entry-points."axio.transport.realtime"]
openai = "axio_transport_openai:OpenAIRealtimeTransport"

[project.entry-points."axio.transport.settings"]
chatgpt = "axio_transport_openai.tui.chatgpt:ChatGPTSettingsScreen"
openai = "axio_transport_openai.tui:OpenAISettingsScreen"
nebius = "axio_transport_openai.tui:NebiusSettingsScreen"
openrouter = "axio_transport_openai.tui:OpenRouterSettingsScreen"
openai-custom = "axio_transport_openai.tui:CustomHubScreen"


[project.urls]
Documentation = "https://docs.axio-agent.com"
Homepage = "https://github.com/mosquito/axio-agent"
Repository = "https://github.com/mosquito/axio-agent"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axio_transport_openai"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "README.md"]

[tool.ruff]
line-length = 119
output-format = "concise"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "ruff>=0.9",
    "pytest-cov>=7.1.0",
    "markdown-pytest>=0.6.0",
    "textual>=2.1.0",
]
