[project]
name = "axio-repl"
version = "0.2.3"
description = "Interactive REPL coding assistant for Axio"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["llm", "agent", "ai", "repl", "coding-assistant"]
dependencies = [
    "axio",
    "aiohttp>=3.11",
]

[project.optional-dependencies]
local = ["axio-tools-local"]
mcp = ["axio-tools-mcp"]
openai = ["axio-transport-openai"]
google = ["axio-transport-google"]
anthropic = ["axio-transport-anthropic"]
codex = ["axio-transport-codex"]
all = ["axio-repl[local,mcp,openai,google,anthropic,codex]"]

[project.scripts]
axio-repl = "axio_repl:main_sync"

[project.urls]
Documentation = "https://docs.axio-agent.com"
Homepage = "https://github.com/mosquito/axio-agent"
Repository = "https://github.com/mosquito/axio-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axio_repl"]

[tool.ruff]
line-length = 119
output-format = "concise"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "axio-tools-local",
    "axio-tools-mcp",
    "axio-transport-google",
    "axio-transport-openai",
    "axio-tui",
    "aiohttp-tiny-mcp~=0.5.8",
    "pydantic>=2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "ruff>=0.9",
]
