[project]
name = "axio-transport-anthropic"
version = "0.1.0"
description = "Anthropic Claude transport for Axio (direct API and Vertex AI)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["axio", "axio-sse", "aiohttp>=3.11"]

[project.optional-dependencies]
vertexai = ["google-auth[requests]>=2.49"]
tui = ["textual>=2.1.0"]

[project.entry-points."axio.transport"]
anthropic = "axio_transport_anthropic:AnthropicTransport"
anthropic-vertex = "axio_transport_anthropic:VertexAITransport"

[project.entry-points."axio.transport.settings"]
anthropic = "axio_transport_anthropic.tui:AnthropicSettingsScreen"
anthropic-vertex = "axio_transport_anthropic.tui.settings:VertexSettingsScreen"

[project.urls]
Documentation = "https://docs.axio-agent.com"
Homepage = "https://github.com/mosquito/axio-agent"
Repository = "https://github.com/mosquito/axio-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axio_transport_anthropic"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "README.md"]

[tool.ruff]
line-length = 119
output-format = "concise"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"


[dependency-groups]
dev = [
    "textual>=2.1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "ruff>=0.9",
    "pytest-cov>=7.1.0",
    "markdown-pytest>=0.6.0",
]
