[project]
name = "axio-tui"
version = "0.2.3"
description = "Textual TUI application for Axio"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["llm", "agent", "ai", "tui", "textual", "terminal", "chat"]
dependencies = [
    "axio",
    "aiohttp>=3.11",
    "aiosqlite>=0.20",
    "pygments>=2.18",
    "rich>=13",
    "textual>=2.1.0",
    "textual-serve>=1.1",
    "argclass>=1.6",
]

[project.optional-dependencies]
history = ["axio-context-sqlite"]
anthropic = ["axio-transport-anthropic"]
openai = ["axio-transport-openai"]
codex = ["axio-transport-codex"]
google = ["axio-transport-google[tui]"]
local = ["axio-tools-local"]
mcp = ["axio-tools-mcp[tui]"]
guards = ["axio-tui-guards[tui]"]
all = [
    "axio-tui[anthropic,openai,codex,google,local,mcp,guards,history]",
]

[project.entry-points."axio.tools.providers"]
tui = "axio_tui.provider:TUIToolProvider"

[project.scripts]
axio = "axio_tui.__main__:main"


[project.urls]
Documentation = "https://docs.axio-agent.com"
Homepage = "https://github.com/mosquito/axio-agent"
Repository = "https://github.com/mosquito/axio-agent"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axio_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "README.md"]

[tool.ruff]
line-length = 119
output-format = "concise"
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
    "axio_transport_anthropic", "axio_transport_codex",
    "axio_tools_local", "axio_tools_local.*",
    "axio_tools_mcp", "axio_tools_mcp.*",
    "axio_tools_docker", "axio_tools_docker.*",
    "axio_tui_guards", "axio_tui_guards.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "axio-tools-local",
    "axio-tools-mcp",
    "axio-context-sqlite",
    "axio-tui-guards",
    "axio-transport-openai",
    "axio-transport-google",
    "aiohttp-tiny-mcp~=0.5.8",
    "pydantic>=2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.14",
    "ruff>=0.9",
    "pytest-cov>=7.1.0",
    "markdown-pytest>=0.6.0",
]
