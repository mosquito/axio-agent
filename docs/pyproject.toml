[project]
name = "axio-docs"
version = "0.1.0"
description = "Documentation for the Axio agent framework"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "axio",
    "axio-audio",
    "axio-context-sqlite",
    "axio-repl",
    "axio-responses",
    "axio-sse",
    "axio-tools-docker",
    "axio-tools-local",
    "axio-tools-mcp",
    "axio-transport-anthropic",
    "axio-transport-codex",
    "axio-transport-google",
    "axio-transport-openai",
]

[dependency-groups]
dev = [
    "markdown-pytest>=0.6.0",
    # The best-practices example imports it; nothing else pulls it in.
    "pydantic-settings>=2",
]
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=1.0",
]

[tool.uv.sources]
axio = { workspace = true }
axio-audio = { workspace = true }
axio-context-sqlite = { workspace = true }
axio-repl = { workspace = true }
axio-responses = { workspace = true }
axio-sse = { workspace = true }
axio-tools-docker = { workspace = true }
axio-tools-local = { workspace = true }
axio-tools-mcp = { workspace = true }
axio-transport-anthropic = { workspace = true }
axio-transport-codex = { workspace = true }
axio-transport-google = { workspace = true }
axio-transport-openai = { workspace = true }
